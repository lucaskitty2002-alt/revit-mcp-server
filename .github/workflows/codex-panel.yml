name: Codex panel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build Revit 2026 plugin
        run: dotnet build plugin/RevitMCPPlugin.csproj -c "Release R26"
      - name: Test Codex panel protocol and Revit bridge
        run: dotnet run --project tests/codex-panel/CodexPanel.Tests.csproj
      - name: Test installation and backup isolation
        run: ./tests/codex-panel/Test-Installer.ps1
