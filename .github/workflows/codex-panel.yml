name: Codex panel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Revit 2026 plugin
        run: dotnet build plugin/RevitMCPPlugin.csproj -c "Release R26"
      - name: Test Codex panel protocol and Revit bridge
        run: dotnet run --project tests/codex-panel/CodexPanel.Tests.csproj
      - name: Test installation and backup isolation
        run: ./tests/codex-panel/Test-Installer.ps1
